<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Render from the repository root: rsvg-convert -o site/dist/social-card.png site/social-card.svg -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111112"/>
      <stop offset="0.55" stop-color="#080808"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="615" y="134" width="740" height="515" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 1h1200" stroke="#292929"/>

  <image x="62" y="66" width="390" height="116" xlink:href="dist/lockup.svg"/>
