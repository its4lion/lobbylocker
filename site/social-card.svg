  <text x="64" y="408" fill="#a2a2a8" font-family="Noto Sans, sans-serif" font-size="21">Block unwanted game server regions.</text>

  <rect x="614" y="133" width="742" height="517" rx="15" fill="#121212" stroke="#414141" stroke-width="2"/>
  <image x="615" y="134" width="740" height="515" clip-path="url(#screen)" xlink:href="dist/lobbylocker.png"/>
  <path d="M0 548h548" stroke="#292929"/>
