name: Publish Release

run-name: Publish the release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to refresh (leave empty to publish the candidate draft)
        required: false
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-candidate:
    name: Publish the candidate draft
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the candidate draft
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft == true) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.created_at) | last | .tag_name // ""')
          if [[ -z "${tag}" ]]; then
            echo "No release candidate draft found. Build one with the Pre-Release workflow first." >&2
            exit 1
          fi

          read -r release_id draft prerelease target <<< "$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq "[.[] | select(.tag_name == \"${tag}\")][0] | [.id, .draft, .prerelease, .target_commitish] | @tsv")"
          if [[ "${draft}" != "true" ]]; then
            echo "The candidate ${tag} is no longer a draft." >&2
            exit 1
          fi
          if [[ "${prerelease}" == "true" ]]; then
            echo "The candidate draft ${tag} is flagged as a prerelease." >&2
            exit 1
          fi

          echo "Publishing the candidate ${tag}."
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
      - name: Commit the version bump and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_ID: ${{ steps.resolve.outputs.release_id }}
          TARGET: ${{ steps.resolve.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"

          head_sha=$(git rev-parse HEAD)
          if [[ "${TARGET}" != "${head_sha}" ]]; then
            echo "main moved since the candidate was built (${TARGET} -> ${head_sha}). Rebuild the candidate." >&2
            exit 1
          fi

          cargo build -q -p bump-version
          target/debug/bump-version set "${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${version}"
            git push origin "HEAD:${GITHUB_REF}"
          fi
          bump_sha=$(git rev-parse HEAD)

          # The CLI preserves tag_name when updating and publishing a draft.
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" --target "${bump_sha}" \
            --draft=false --prerelease=false

          read -r published_tag still_draft still_prerelease <<< "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '[.tag_name, .draft, .prerelease] | @tsv')"
          if [[ "${published_tag}" != "${TAG}" || "${still_draft}" != "false" || "${still_prerelease}" != "false" ]]; then
            echo "Publishing ${TAG} failed (tag=${published_tag}, draft=${still_draft}, prerelease=${still_prerelease})." >&2
            exit 1
          fi
          echo "Published ${TAG} at ${bump_sha}."
