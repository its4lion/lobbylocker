name: Prepare Release
run-name: Prepare v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to bump to, without the v prefix (for example, 0.0.2)
        required: true
        type: string

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Bump and validate version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require a branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Prepare Release must run from a branch so the version bump can be committed." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Bump and validate all version metadata
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit(f"Invalid stable semantic version: {version}")

          current = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          if tuple(map(int, version.split("."))) < tuple(map(int, current.split("."))):
              raise SystemExit(f"Cannot lower the version from {current} to {version}")

          updates = {}

          def bump(file, pattern, expected_count=1):
              text = Path(file).read_text(encoding="utf-8")
              updated, count = re.subn(pattern, lambda match: f'{match[1]}"{version}"', text)
              if count != expected_count:
                  raise SystemExit(f"{file}: expected {expected_count} version entries, found {count}")
              updates[file] = updated
              return updated

          json_files = [
              "package.json",
              "apps/tauri/package.json",
              "packages/ui/package.json",
              "apps/tauri/src-tauri/tauri.conf.json",
          ]
          for file in json_files:
              updated = bump(file, r'(?m)^([ \t]*"version"[ \t]*:[ \t]*)"[^"\n]*"')
              actual = json.loads(updated)["version"]
              if actual != version:
                  raise SystemExit(f"{file} has version {actual}, expected {version}")

          updated = bump("Cargo.toml", r'(?m)^(\[workspace\.package\]\nversion = )"[^"\n]*"')
          actual = tomllib.loads(updated)["workspace"]["package"]["version"]
          if actual != version:
              raise SystemExit(f"Cargo.toml has version {actual}, expected {version}")

          updated = bump(
              "Cargo.lock",
              r'(?m)^(\[\[package\]\]\nname = "(?:lobbylocker-core|lobbylocker-tauri)"\nversion = )"[^"\n]*"',
              expected_count=2,
          )
          packages = tomllib.loads(updated)["package"]
          workspace = {
              package["name"]: package["version"]
              for package in packages
              if package["name"] in {"lobbylocker-core", "lobbylocker-tauri"}
          }
          expected = {"lobbylocker-core": version, "lobbylocker-tauri": version}
          if workspace != expected:
              raise SystemExit(f"Cargo.lock workspace versions are {workspace}, expected {expected}")

          # Preserve formatting and dependency versions; write only after every file validates.
          for file, updated in updates.items():
              Path(file).write_text(updated, encoding="utf-8")
          print(f"Updated all version metadata to {version}")
          PY
      - name: Ensure the tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi
      - name: Commit and push version bump
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/tauri/package.json packages/ui/package.json \
            apps/tauri/src-tauri/tauri.conf.json Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${VERSION}"
            git push origin "HEAD:${GITHUB_REF}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  source-quality:
    name: Format, typecheck, and frontend tests
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r check
      - run: pnpm --filter @lobbylocker/tauri test

  rust-linux:
    name: Rust tests and Clippy / Arch Linux
    needs: validate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git gtk3 webkit2gtk-4.1 librsvg pkgconf nodejs pnpm
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-ubuntu:
    name: Rust tests and Clippy / Ubuntu 24.04
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust tests and Clippy / Windows
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-arch:
    name: Build Arch package
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git gtk3 webkit2gtk-4.1 librsvg pkgconf nodejs pnpm rustup nftables polkit namcap
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Install Rust toolchain
        run: rustup default 1.90.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - name: Build release executable
        run: pnpm --filter @lobbylocker/tauri exec tauri build --no-bundle
      - name: Build pacman package
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/lobbylocker-arch"
          install -d "${package_root}/payload"
          install -Dm755 target/release/lobbylocker "${package_root}/payload/lobbylocker"
          cp -a data "${package_root}/payload/data"
          install -Dm644 apps/tauri/src/lib/assets/brand/lobbylocker-icon.svg "${package_root}/payload/lobbylocker.svg"
          install -Dm644 packaging/arch/lobbylocker.desktop "${package_root}/payload/lobbylocker.desktop"
          install -Dm644 packaging/arch/lobbylocker-reset-firewall.hook "${package_root}/payload/lobbylocker-reset-firewall.hook"
          install -Dm644 LICENSE "${package_root}/payload/LICENSE"
          cp packaging/arch/PKGBUILD.release "${package_root}/PKGBUILD"
          if [[ "${VERSION}" == *-* ]]; then
            arch_version="${VERSION%%-*}pre.${VERSION#*-}"
            arch_version="${arch_version%%+*}"
            arch_version="${arch_version//-/.}"
          else
            arch_version="${VERSION%%+*}"
          fi
          sed -i "s/^pkgver=.*/pkgver=${arch_version}/" "${package_root}/PKGBUILD"
          useradd --create-home builder
          chown -R builder:builder "${package_root}"
          runuser -u builder -- bash -lc "cd '${package_root}' && makepkg --noconfirm"
          package_file=$(find "${package_root}" -maxdepth 1 -name '*.pkg.tar.zst' -type f -print -quit)
          test -n "${package_file}"
          namcap "${package_root}/PKGBUILD"
          namcap "${package_file}"
          mkdir -p release-assets
          cp "${package_file}" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: release-assets/*.pkg.tar.zst
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: ubuntu-22.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu 24.04 DEB
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - name: Build package-managed DEB
        run: >-
          pnpm --filter @lobbylocker/tauri exec tauri build --bundles deb
          --config src-tauri/tauri.no-updater-artifacts.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows NSIS installer
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: windows-2025
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: [validate, build-arch, build-appimage, build-ubuntu, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          (cd release-assets && find . -maxdepth 1 -type f ! -name 'LobbyLocker-SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum) > release-assets/LobbyLocker-SHA256SUMS.txt
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          args=(
            "v${VERSION}"
            release-assets/*
            --draft
            --generate-notes
            --target "${RELEASE_SHA}"
            --title "LobbyLocker v${VERSION}"
          )
          gh release create "${args[@]}"
