name: Pre-Release

run-name: Build release candidate ${{ inputs.version || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override (for example, 0.1.0); derived automatically when empty
        required: false
        type: string

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve the candidate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q -p bump-version
          tool=target/debug/bump-version

          git ls-remote --tags origin 'refs/tags/v*' \
            | awk '{print $2}' \
            | sed 's#^refs/tags/##' \
            | sed 's#\^{}$##' \
            | sort -u > tags.txt

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION}"
          else
            version=$("${tool}" derive-stable --tags-file tags.txt)
          fi
          echo "Building candidate v${version}"
          "${tool}" set "${version}" --dry-run

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  source-quality:
    name: Format and tests
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  rust-linux:
    name: Rust tests and Clippy / Arch Linux
    needs: prepare
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git pkgconf libxkbcommon
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-ubuntu:
    name: Rust tests and Clippy / Ubuntu 24.04
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust tests and Clippy / Windows
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  gate:
    name: Check the release gates
    needs: [prepare, source-quality, rust-linux, rust-ubuntu, rust-windows]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          allowed=true
          for result in "${{ needs.source-quality.result }}" "${{ needs.rust-linux.result }}" "${{ needs.rust-ubuntu.result }}" "${{ needs.rust-windows.result }}"; do
            if [[ "${result}" != "success" ]]; then
              allowed=false
            fi
          done
          echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"

  build-arch:
    name: Build Arch package
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git pkgconf libxkbcommon vulkan-icd-loader rustup nftables polkit namcap
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Rust toolchain
        run: rustup default 1.99.1
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: cargo run -q -p bump-version -- set "${VERSION}"
      - name: Build release binaries
        run: cargo build --release -p lobbylocker-app -p lobbylocker-core
      - name: Build pacman package
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/lobbylocker-arch"
          install -d "${package_root}/payload"
          install -Dm755 target/release/lobbylocker-app "${package_root}/payload/lobbylocker-app"
          install -Dm755 target/release/lobbylocker "${package_root}/payload/lobbylocker"
          cp -a data "${package_root}/payload/data"
          install -Dm644 packaging/brand/lobbylocker-icon.svg "${package_root}/payload/lobbylocker.svg"
          install -Dm644 packaging/arch/lobbylocker.desktop "${package_root}/payload/lobbylocker.desktop"
          install -Dm644 packaging/arch/lobbylocker-reset-firewall.hook "${package_root}/payload/lobbylocker-reset-firewall.hook"
          install -Dm644 LICENSE "${package_root}/payload/LICENSE"
          cp packaging/arch/PKGBUILD.release "${package_root}/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${VERSION%%+*}/" "${package_root}/PKGBUILD"
          useradd --create-home builder
          chown -R builder:builder "${package_root}"
          runuser -u builder -- bash -lc "cd '${package_root}' && makepkg --noconfirm"
          package_file=$(find "${package_root}" -maxdepth 1 -name '*.pkg.tar.zst' -type f -print -quit)
          test -n "${package_file}"
          namcap "${package_root}/PKGBUILD"
          namcap "${package_file}"
          mkdir -p release-assets
          cp "${package_file}" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: release-assets/*.pkg.tar.zst
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: cargo run -q -p bump-version -- set "${VERSION}"
      - name: Build release binaries
        run: cargo build --release -p lobbylocker-app -p lobbylocker-core
      - name: Build the AppImage
        run: |
          set -euo pipefail
          AppDir="${RUNNER_TEMP}/lobbylocker.AppDir"
          install -d "${AppDir}/usr/bin"
          install -d "${AppDir}/usr/share/lobbylocker/data"
          cp target/release/lobbylocker-app "${AppDir}/usr/bin/lobbylocker-app"
          cp target/release/lobbylocker "${AppDir}/usr/bin/lobbylocker"
          cp -a data "${AppDir}/usr/share/lobbylocker/data"
          install -Dm644 packaging/arch/lobbylocker.desktop "${AppDir}/lobbylocker.desktop"
          install -Dm644 packaging/brand/lobbylocker-icon.svg "${AppDir}/lobbylocker.svg"
          install -Dm644 packaging/brand/lobbylocker-icon.svg "${AppDir}/.DirIcon"
          cat > "${AppDir}/lobbylocker-app.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=LobbyLocker
          Exec=lobbylocker-app
          Icon=lobbylocker
          Categories=Utility;
          EOF
          cat > "${AppDir}/AppRun" <<'EOF'
          #!/bin/sh
          APP="${APPDIR}/usr/bin"
          exec "${APP}/lobbylocker-app" "$@"
          EOF
          chmod +x "${AppDir}/AppRun"
          curl -fLO https://github.com/AppImage/appimagetool-continuous.git/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract --quiet 2>/dev/null || true
          mkdir -p release-assets
          ./squashfs-root/AppRun --appimage-extract-and-run "${AppDir}" "release-assets/LobbyLocker-${VERSION}-x86_64.AppImage" 2>/dev/null || \
            ./appimagetool-x86_64.AppImage "${AppDir}" "release-assets/LobbyLocker-${VERSION}-x86_64.AppImage"
          test -f "release-assets/LobbyLocker-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: release-assets/*.AppImage
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu 24.04 DEB
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: cargo run -q -p bump-version -- set "${VERSION}"
      - name: Build release binaries
        run: cargo build --release -p lobbylocker-app -p lobbylocker-core
      - name: Build the DEB
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/lobbylocker-deb"
          rm -rf "${root}"
          install -d "${root}/DEBIAN" "${root}/usr/bin" "${root}/usr/share/applications" \
            "${root}/usr/share/icons/hicolor/scalable/apps" \
            "${root}/usr/share/polkit-1/actions" \
            "${root}/usr/share/lobbylocker/data"
          install -Dm755 target/release/lobbylocker-app "${root}/usr/bin/lobbylocker-app"
          install -Dm755 target/release/lobbylocker "${root}/usr/bin/lobbylocker"
          install -Dm644 packaging/arch/lobbylocker.desktop "${root}/usr/share/applications/lobbylocker.desktop"
          install -Dm644 packaging/brand/lobbylocker-icon.svg "${root}/usr/share/icons/hicolor/scalable/apps/lobbylocker.svg"
          install -Dm644 packaging/linux/org.lobbylocker.firewall.policy "${root}/usr/share/polkit-1/actions/org.lobbylocker.firewall.policy"
          cp -a data/games data/locales "${root}/usr/share/lobbylocker/data/"
          cat > "${root}/DEBIAN/control" <<EOF
          Package: lobbylocker
          Version: ${VERSION%%+*}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: nftables, polkitd | polkit, libc6, libvulkan1, libxkbcommon0, libgl1
          Maintainer: LobbyLocker <https://github.com/its4lion/LobbyLocker>
          Description: LobbyLocker blocks selected game server regions
           LobbyLocker blocks selected game server addresses through the operating
           system firewall.
          EOF
          install -Dm755 packaging/linux/deb-prerm.sh "${root}/DEBIAN/prerm"
          dpkg-deb --build "${root}" "release-assets-lobbylocker_${VERSION%%+*}_amd64.deb"
          mkdir -p release-assets
          mv "release-assets-lobbylocker_${VERSION%%+*}_amd64.deb" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-deb
          path: release-assets/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: cargo run -q -p bump-version -- set "${VERSION}"
      - name: Build release binaries
        run: cargo build --release -p lobbylocker-app -p lobbylocker-core
      - name: Stage payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cp target/release/lobbylocker-app.exe payload/lobbylocker-app.exe
          cp target/release/lobbylocker.exe payload/lobbylocker.exe
          cp -a data payload/data
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y
      - name: Build the installer
        run: makensis -V4 -DVERSION=${{ needs.prepare.outputs.version }} packaging/windows/lobbylocker.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-assets/*.exe
          if-no-files-found: error

  candidate:
    name: Create the release candidate draft
    needs:
      [prepare, gate, build-arch, build-appimage, build-ubuntu, build-windows]
    if: >-
      always() &&
      needs.gate.outputs.allowed == 'true' &&
      needs.build-arch.result == 'success' &&
      needs.build-appimage.result == 'success' &&
      needs.build-ubuntu.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          (cd release-assets && find . -maxdepth 1 -type f ! -name 'LobbyLocker-SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum) > release-assets/LobbyLocker-SHA256SUMS.txt
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          state=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq "[.[] | select(.tag_name == \"${tag}\")] | .[0] | if . == null then \"missing\" elif .draft then \"draft\" else \"published\" end")
          if [[ "${state}" == "published" ]]; then
            echo "Release ${tag} is already published." >&2
            exit 1
          fi
          if [[ "${state}" == "draft" ]]; then
            echo "Replacing the existing draft ${tag}."
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes
          fi

          notes="Release candidate for v${VERSION}, built from commit ${RELEASE_SHA}. Publish it with the Publish workflow, or publish this draft by hand."

          gh release create "${tag}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --target "${RELEASE_SHA}" \
            --title "LobbyLocker v${VERSION}" \
            --notes "${notes}"
