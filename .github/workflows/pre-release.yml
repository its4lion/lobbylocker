name: Pre-Release

run-name: Build release candidate ${{ inputs.version || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override (for example, 0.1.0); derived automatically when empty
        required: false
        type: string

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve the candidate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags origin 'refs/tags/v*' \
            | awk '{print $2}' \
            | sed 's#^refs/tags/##' \
            | sed 's#\^{}$##' \
            | sort -u > tags.txt

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION}"
          else
            version=$(python3 scripts/bump-version.py derive-stable --tags-file tags.txt)
          fi
          echo "Building candidate v${version}"
          python3 scripts/bump-version.py set "${version}" --dry-run

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  source-quality:
    name: Format, typecheck, and frontend tests
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r check
      - run: pnpm --filter @lobbylocker/tauri test

  rust-linux:
    name: Rust tests and Clippy / Arch Linux
    needs: prepare
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git gtk3 webkit2gtk-4.1 librsvg pkgconf nodejs pnpm
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-ubuntu:
    name: Rust tests and Clippy / Ubuntu 24.04
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust tests and Clippy / Windows
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  gate:
    name: Check the release gates
    needs: [prepare, source-quality, rust-linux, rust-ubuntu, rust-windows]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          allowed=true
          for result in "${{ needs.source-quality.result }}" "${{ needs.rust-linux.result }}" "${{ needs.rust-ubuntu.result }}" "${{ needs.rust-windows.result }}"; do
            if [[ "${result}" != "success" ]]; then
              allowed=false
            fi
          done
          echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"

  build-arch:
    name: Build Arch package
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git gtk3 webkit2gtk-4.1 librsvg pkgconf nodejs pnpm rustup nftables polkit namcap python
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Rust toolchain
        run: rustup default 1.90.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python3 scripts/bump-version.py set "${VERSION}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - name: Build release executable
        run: pnpm --filter @lobbylocker/tauri exec tauri build --no-bundle
      - name: Build pacman package
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/lobbylocker-arch"
          install -d "${package_root}/payload"
          install -Dm755 target/release/lobbylocker "${package_root}/payload/lobbylocker"
          cp -a data "${package_root}/payload/data"
          install -Dm644 apps/tauri/src/lib/assets/brand/lobbylocker-icon.svg "${package_root}/payload/lobbylocker.svg"
          install -Dm644 packaging/arch/lobbylocker.desktop "${package_root}/payload/lobbylocker.desktop"
          install -Dm644 packaging/arch/lobbylocker-reset-firewall.hook "${package_root}/payload/lobbylocker-reset-firewall.hook"
          install -Dm644 LICENSE "${package_root}/payload/LICENSE"
          cp packaging/arch/PKGBUILD.release "${package_root}/PKGBUILD"
          sed -i "s/^pkgver=.*/pkgver=${VERSION%%+*}/" "${package_root}/PKGBUILD"
          useradd --create-home builder
          chown -R builder:builder "${package_root}"
          runuser -u builder -- bash -lc "cd '${package_root}' && makepkg --noconfirm"
          package_file=$(find "${package_root}" -maxdepth 1 -name '*.pkg.tar.zst' -type f -print -quit)
          test -n "${package_file}"
          namcap "${package_root}/PKGBUILD"
          namcap "${package_file}"
          mkdir -p release-assets
          cp "${package_file}" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: release-assets/*.pkg.tar.zst
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python3 scripts/bump-version.py set "${VERSION}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - name: Build the AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles appimage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu 24.04 DEB
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python3 scripts/bump-version.py set "${VERSION}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles deb --config src-tauri/tauri.no-updater-artifacts.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows NSIS installer
    needs: [prepare, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: windows-2025
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply the candidate version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: python scripts/bump-version.py set "${VERSION}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri icons
      - name: Build the NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  candidate:
    name: Create the release candidate draft
    needs:
      [prepare, gate, build-arch, build-appimage, build-ubuntu, build-windows]
    if: >-
      always() &&
      needs.gate.outputs.allowed == 'true' &&
      needs.build-arch.result == 'success' &&
      needs.build-appimage.result == 'success' &&
      needs.build-ubuntu.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          (cd release-assets && find . -maxdepth 1 -type f ! -name 'LobbyLocker-SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum) > release-assets/LobbyLocker-SHA256SUMS.txt
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          state=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq "[.[] | select(.tag_name == \"${tag}\")] | .[0] | if . == null then \"missing\" elif .draft then \"draft\" else \"published\" end")
          if [[ "${state}" == "published" ]]; then
            echo "Release ${tag} is already published." >&2
            exit 1
          fi
          if [[ "${state}" == "draft" ]]; then
            echo "Replacing the existing draft ${tag}."
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes
          fi

          notes="Release candidate for v${VERSION}, built from commit ${RELEASE_SHA}. Publish it with the Publish Updater workflow, or publish this draft by hand."

          gh release create "${tag}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --target "${RELEASE_SHA}" \
            --title "LobbyLocker v${VERSION}" \
            --notes "${notes}"
