name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-script:
    name: Release version script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the version script
        shell: bash
        run: |
          set -euo pipefail

          version=$(python3 scripts/bump-version.py derive-stable --tags-file /dev/null)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected derived version: ${version}" >&2
            exit 1
          fi

          # Build metadata is not a valid release version.
          if python3 scripts/bump-version.py set "${version}+build.1" --dry-run; then
            echo "Build metadata must be rejected." >&2
            exit 1
          fi

          # Writing the version must touch every metadata file and nothing else.
          work=$(mktemp -d)
          mkdir -p "${work}/scripts"
          cp package.json Cargo.toml Cargo.lock "${work}/"
          cp scripts/bump-version.py "${work}/scripts/"
          (cd "${work}" && python3 scripts/bump-version.py set 9.9.9)

          if ! grep -q '"version": "9.9.9"' "${work}/package.json"; then
            echo "${work}/package.json was not updated." >&2
            exit 1
          fi
          if ! grep -q '^version = "9.9.9"' "${work}/Cargo.toml"; then
            echo "Cargo.toml was not updated." >&2
            exit 1
          fi
          if [[ $(grep -c '^version = "9.9.9"$' "${work}/Cargo.lock") -ne 2 ]]; then
            echo "Cargo.lock was not updated." >&2
            exit 1
          fi

  rust-linux:
    name: Rust / Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git pkgconf
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  rust-ubuntu:
    name: Rust / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  rust-windows:
    name: Rust / Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  headless:
    name: Headless Rune checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Render every scene headlessly
        run: |
          set -euo pipefail
          for scene in cs2 blocked settings connections empty reset edit edit-add edit-details; do
            cargo run -p lobbylocker-app -- --snap "/tmp/lobbylocker-${scene}.png" --scene "$scene"
          done
      - name: Dump element trees
        run: |
          set -euo pipefail
          for scene in cs2 blocked settings connections empty reset edit edit-add edit-details; do
            cargo run -p lobbylocker-app -- --tree "/tmp/lobbylocker-${scene}.json" --scene "$scene"
          done
          python3 - <<'EOF'
          import json, sys
          for scene in ["cs2", "blocked", "settings", "connections", "empty", "reset", "edit", "edit-add", "edit-details"]:
              tree = json.load(open(f"/tmp/lobbylocker-{scene}.json"))
              elements = tree["elements"]
              assert elements, scene
              keys = {e.get("key") for e in elements if e.get("key")}
              assert "tab-regions" in keys, scene
          print("all scenes rendered")
          EOF
      - name: Check compact layouts
        run: |
          set -euo pipefail
          for size in 420x800 360x560; do
            cargo run -p lobbylocker-app -- --snap "/tmp/lobbylocker-compact-${size}.png" --scene compact --size "$size"
            cargo run -p lobbylocker-app -- --tree "/tmp/lobbylocker-compact-${size}.json" --scene compact --size "$size"
          done
          python3 - <<'EOF'
          import json
          for size in ["420x800", "360x560"]:
              tree = json.load(open(f"/tmp/lobbylocker-compact-{size}.json"))
              keys = {e.get("key") for e in tree["elements"] if e.get("key")}
              assert {"compact-game-trigger", "compact-reset", "layout-toggle"} <= keys, size
              assert "tab-regions" not in keys, size
          EOF
      - name: Check compact window transitions
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix="lobbylocker-layout-") as temp:
              root = pathlib.Path(temp)
              env = os.environ.copy()
              env["XDG_CONFIG_HOME"] = temp
              env["LOBBYLOCKER_NO_FIREWALL"] = "1"
              script, tree = root / "actions.json", root / "tree.json"
              for actions, compact in [
                  ([{"t": 0.2, "type": "tap", "key": "layout-toggle"}], True),
                  ([{"t": 0.2, "type": "tap", "key": "layout-toggle"},
                    {"t": 0.7, "type": "tap", "key": "layout-toggle"}], False),
              ]:
                  script.write_text(json.dumps(actions))
                  subprocess.run(["cargo", "run", "-q", "-p", "lobbylocker-app", "--", "--scene", "cs2", "--script", str(script), "--at", "1.2", "--tree", str(tree)], env=env, check=True)
                  elements = json.loads(tree.read_text())["elements"]
                  keys = {e.get("key") for e in elements}
                  assert ("compact-picker" in keys) == compact
                  pane = next(e for e in elements if e.get("key") == "main-pane")
                  assert (pane["rect"][2] < 420) == compact, pane["rect"]
          EOF
      - name: Upload snapshots
        uses: actions/upload-artifact@v7
        with:
          name: rune-snapshots
          path: /tmp/lobbylocker-*.png
          if-no-files-found: error
