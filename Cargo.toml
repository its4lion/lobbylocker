[workspace]
members = ["apps/tauri/src-tauri", "apps/tauri/src-tauri/core"]
default-members = ["apps/tauri/src-tauri/core"]
resolver = "2"

[workspace.package]
version = "0.0.5"
edition = "2021"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/its4lion/LobbyLocker"

[workspace.dependencies]
lobbylocker-core = { path = "apps/tauri/src-tauri/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
dirs = "7"
tempfile = "3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.17"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
