# Bacon config for LobbyLocker (Rune desktop app).
# Install: `sudo pacman -S bacon` or `cargo install --locked bacon`
# Run the app with restart-on-save: `bacon run-app`

default_job = "run-app"

[jobs.run-app]
command = ["cargo", "run", "-p", "lobbylocker-app"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
watch = [
    "src",
    "crates/core/src",
    "data",
    "Cargo.toml",
    "crates/core/Cargo.toml",
    "packaging",
]

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["src", "crates", "Cargo.toml", "Cargo.lock"]

[jobs.clippy]
command = [
    "cargo", "clippy",
    "--workspace", "--all-targets",
    "--color", "always",
    "--",
    "-D", "warnings",
]
need_stdout = false
watch = ["src", "crates", "Cargo.toml", "Cargo.lock"]

[jobs.test]
command = ["cargo", "test", "--workspace", "--color", "always"]
need_stdout = true
watch = ["src", "crates", "tests", "Cargo.toml", "Cargo.lock"]
